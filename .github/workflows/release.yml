name: release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    name: Build Go binaries
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Build binaries
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/Terminalauncher-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o dist/Terminalauncher-linux-arm64 .
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/Terminalauncher-windows-amd64.exe .
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o dist/Terminalauncher-darwin-arm64 .

      - name: Build portable Windows package
        run: |
          mkdir -p portable
          cp dist/Terminalauncher-windows-amd64.exe portable/
          cp LICENSE portable/
          cp README.md portable/
          cd portable && zip -9 ../dist/Terminalauncher-windows-amd64-portable.zip *

      - name: Upload binaries to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload --clobber ${{ github.event.release.tag_name }} dist/*
